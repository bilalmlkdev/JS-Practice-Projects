<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Theme Switcher</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 2rem;
      transition: background 0.3s, color 0.3s;
      background: #fff;
      color: #000;
    }

    body.dark {
      background: #1a1a1a;
      color: #fff;
    }
  </style>
</head>

<body>
  <h2>Theme Switcher</h2>
  <p>Click the button to switch between Light and Dark mode.</p>
  <button id="toggleBtn">Switch to Dark</button>
  <script src="index.js"></script>
</body>

</html>

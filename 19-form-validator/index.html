<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Form Validator</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      padding: 2rem;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group input {
      display: block;
      padding: 8px;
      width: 250px;
    }

    .error {
      color: red;
      font-size: 12px;
    }

    .input-error {
      border: 2px solid red;
    }
  </style>
</head>

<body>
  <div>
    <h2>Register</h2>
    <div class="form-group"><label>Username</label><input id="username" placeholder="Min 3 chars"><small class="error"
        id="userErr"></small></div>
    <div class="form-group"><label>Email</label><input id="email" placeholder="Valid email"><small class="error"
        id="emailErr"></small></div>
    <div class="form-group"><label>Password</label><input id="password" type="password" placeholder="Min 6 chars"><small
        class="error" id="passErr"></small></div>
    <button id="submitBtn">Submit</button>
  </div>
  <script src="index.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Currency Converter</title>
<style>body{font-family:sans-serif;text-align:center;padding:2rem;}input,select,button{padding:8px 12px;margin:5px;}</style>
</head>
<body>
<h1>Currency Converter</h1>
<input type="number" id="amount" value="1" min="0" step="0.01">
<select id="from"><option value="USD">USD</option><option value="EUR">EUR</option></select>
<select id="to"><option value="EUR">EUR</option><option value="USD">USD</option></select>
<button id="convertBtn">Convert</button>
<h2 id="result">--</h2>
<script src="index.js"></script>
</body>
</html>

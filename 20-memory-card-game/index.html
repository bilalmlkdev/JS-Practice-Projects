<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Memory Card Game</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 80px);
      gap: 10px;
      justify-content: center;
      margin-top: 20px;
    }

    .card {
      height: 80px;
      background: #3498db;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      cursor: pointer;
      border-radius: 8px;
      color: #fff;
    }

    .card.flipped {
      background: #fff;
      color: #000;
    }
  </style>
</head>

<body>
  <h2>Memory Game</h2>
  <div class="grid" id="grid"></div>
  <p id="msg"></p>
  <script src="index.js"></script>
</body>

</html>

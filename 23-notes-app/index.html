<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Notes App</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 2rem;
      max-width: 500px;
      margin: 0 auto;
    }

    .note-item {
      display: flex;
      justify-content: space-between;
      background: #f4f4f4;
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
    }

    .del-btn {
      background: red;
      color: white;
      border: none;
      padding: 5px 10px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <h2>Notes App</h2>
  <input type="text" id="noteInput" placeholder="Enter a note..." style="width:70%;padding:8px;">
  <button id="addBtn">Add Note</button>
  <div id="notesContainer"></div>
  <script src="index.js"></script>
</body>

</html>

<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Color Picker</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin-top: 50px;
    }

    .box {
      width: 200px;
      height: 200px;
      border: 1px solid #ccc;
      margin: 20px auto;
    }
  </style>
</head>

<body>
  <h2>Pick a Color</h2>
  <input type="color" id="colorPicker" value="#ff0000">
  <div class="box" id="colorBox" style="background-color:#ff0000;"></div>
  <p id="colorText">HEX: #ff0000</p>
  <script src="index.js"></script>
</body>

</html>

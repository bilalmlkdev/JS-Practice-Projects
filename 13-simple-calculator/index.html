<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Calculator</title>
<style>body{font-family:sans-serif;text-align:center;}.calc{display:grid;grid-template-columns:repeat(4,60px);gap:5px;justify-content:center;margin-top:20px;}input{grid-column:span 4;padding:10px;text-align:right;}</style>
</head>
<body>
<h2>Calculator</h2>
<div class="calc">
  <input type="text" id="display" readonly>
  <button onclick="clearDisplay()">C</button><button onclick="append('(')">(</button><button onclick="append(')')">)</button><button onclick="append('/')">/</button>
  <button onclick="append('7')">7</button><button onclick="append('8')">8</button><button onclick="append('9')">9</button><button onclick="append('*')">*</button>
  <button onclick="append('4')">4</button><button onclick="append('5')">5</button><button onclick="append('6')">6</button><button onclick="append('-')">-</button>
  <button onclick="append('1')">1</button><button onclick="append('2')">2</button><button onclick="append('3')">3</button><button onclick="append('+')">+</button>
  <button onclick="append('0')">0</button><button onclick="append('.')">.</button><button onclick="calculate()" style="grid-column:span 2;">=</button>
</div>
<script src="index.js"></script>
</body>
</html>

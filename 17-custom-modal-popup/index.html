<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Modal Popup</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin-top: 50px;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: #fff;
      padding: 2rem;
      border-radius: 8px;
      max-width: 400px;
      position: relative;
    }

    .close {
      position: absolute;
      top: 10px;
      right: 15px;
      cursor: pointer;
      font-size: 24px;
    }
  </style>
</head>

<body>
  <button id="openBtn">Open Modal</button>
  <div class="modal" id="modal">
    <div class="modal-content">
      <span class="close" id="closeBtn">&times;</span>
      <h2>Hello!</h2>
      <p>This is a custom modal popup.</p>
    </div>
  </div>
  <script src="index.js"></script>
</body>

</html>
